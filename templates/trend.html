{% extends "base.html" %}

{% block title %}趋势分析 - Asset Trend System{% endblock %}

{% block content %}
<h2>资产趋势分析</h2>

<div class="row mb-3">
    <div class="col-md-12">
        <form id="trendForm" class="row g-3">
            <div class="col-md-4">
                <label for="startDate" class="form-label">开始日期</label>
                <input type="date" class="form-control" id="startDate">
            </div>
            <div class="col-md-4">
                <label for="endDate" class="form-label">结束日期</label>
                <input type="date" class="form-control" id="endDate">
            </div>
            <div class="col-md-4">
                <label for="assetSelect" class="form-label">选择资产</label>
                <select id="assetSelect" class="form-select" multiple aria-label="多选资产">
                    <!-- 资产选项将通过JavaScript动态加载 -->
                </select>
            </div>
            <div class="col-md-12 mt-3">
                <button type="button" class="btn btn-primary" onclick="loadTrend()">查看趋势</button>
            </div>
        </form>
    </div>
</div>

<div id="trendChart" class="mt-4">
    <!-- 图表将在这里显示 -->
</div>

<script>
    // 页面加载完成后获取资产列表
    window.addEventListener('DOMContentLoaded', function() {
        loadAssets();
        
        // 设置默认日期范围（最近30天）
        const today = new Date();
        const oneMonthAgo = new Date();
        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
        
        document.getElementById('startDate').valueAsDate = oneMonthAgo;
        document.getElementById('endDate').valueAsDate = today;
    });

    // 获取资产列表并填充下拉框
    function loadAssets() {
        fetch('/assets/')
        .then(response => response.json())
        .then(assets => {
            const select = document.getElementById('assetSelect');
            assets.forEach(asset => {
                const option = document.createElement('option');
                option.value = asset.id;
                option.textContent = asset.name;
                select.appendChild(option);
            });
        })
        .catch(error => {
            console.error('加载资产列表失败:', error);
        });
    }

    function loadTrend() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const selectedAssets = Array.from(document.getElementById('assetSelect').selectedOptions)
                                    .map(option => option.value);
        
        let url = '/trend/plot';
        const params = new URLSearchParams();
        
        if (startDate) {
            params.append('start_date', startDate);
        }
        
        if (endDate) {
            params.append('end_date', endDate);
        }
        
        if (selectedAssets.length > 0) {
            params.append('asset_ids', selectedAssets.join(','));
        }
        
        if (params.toString()) {
            url += '?' + params.toString();
        }
        
        fetch(url)
        .then(response => response.text())
        .then(html => {
            document.getElementById('trendChart').innerHTML = html;
        })
        .catch(error => {
            console.error('加载趋势图失败:', error);
            document.getElementById('trendChart').innerHTML = '<div class="alert alert-danger">加载趋势图失败</div>';
        });
    }
</script>
{% endblock %}
